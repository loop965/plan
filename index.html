<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的投资助手</title>
    <style>
        :root {
            --ios-bg: #F2F2F7;
            --ios-card: #FFFFFF;
            --ios-blue: #007AFF;
            --ios-gray: #8E8E93;
            --tab-bg: rgba(255, 255, 255, 0.8);
        }

        [data-theme='dark'] {
            --ios-bg: #000000;
            --ios-card: #1C1C1E;
            --ios-blue: #0A84FF;
            --tab-bg: rgba(28, 28, 30, 0.8);
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--ios-bg);
            margin: 0;
            padding: 0;
            padding-bottom: 90px; /* 为底栏留出空间 */
        }

        /* 顶部大标题 */
        .header {
            padding: 60px 20px 20px;
        }
        .header h1 { font-size: 34px; font-weight: 800; margin: 0; }

        /* 内容卡片 */
        .content-card {
            background: var(--ios-card);
            margin: 0 16px 20px;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: inherit;
        }
        .content-card:active { opacity: 0.7; transform: scale(0.98); }
        .card-info h3 { margin: 0; font-size: 18px; }
        .card-info p { margin: 5px 0 0; font-size: 14px; color: var(--ios-gray); }
        .arrow { color: var(--ios-gray); font-weight: bold; }

        /* ✨ Apple 风格底栏导航 ✨ */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 84px; /* 包含 iPhone 底部安全区 */
            background: var(--tab-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding-top: 10px;
            border-top: 0.5px solid rgba(0,0,0,0.1);
            z-index: 1000;
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--ios-gray);
            font-size: 10px;
            font-weight: 500;
            width: 25%;
        }

        .tab-item.active { color: var(--ios-blue); }

        .tab-icon {
            font-size: 24px;
            margin-bottom: 4px;
        }

        /* 适配深色模式边框 */
        [data-theme='dark'] .tab-bar { border-top: 0.5px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body data-theme="light">

    <div class="header">
        <h1>探索</h1>
    </div>

    <!-- 页面列表 -->
    <a href="plan.html" class="content-card">
        <div class="card-info">
            <h3>📈 基金加仓计划</h3>
            <p>基于成本跌幅的精密计算</p>
        </div>
        <div class="arrow">〉</div>
    </a>

    <a href="profit.html" class="content-card">
        <div class="card-info">
            <h3>💰 盈利预演</h3>
            <p>模拟未来止盈方案</p>
        </div>
        <div class="arrow">〉</div>
    </a>

    <!-- 底部导航栏 -->
    <nav class="tab-bar">
        <a href="index.html" class="tab-item active">
            <span class="tab-icon">🧭</span>
            <span>探索</span>
        </a>
        <a href="plan.html" class="tab-item">
            <span class="tab-icon">📊</span>
            <span>加仓计划</span>
        </a>
        <a href="profit.html" class="tab-item">
            <span class="tab-icon">💵</span>
            <span>盈利预演</span>
        </a>
        <a href="settings.html" class="tab-item">
            <span class="tab-icon">⚙️</span>
            <span>设置</span>
        </a>
    </nav>

    <script>
        // 检测系统深色模式预设
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.body.setAttribute('data-theme', 'dark');
        }
    </script>
</body>
</html>
