<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>基金加仓计划</title>
    <style>
        :root {
            --bg-color: #F4F5F7;
            --card-bg: #FFFFFF;
            --input-bg: #F0F2F5;
            --primary-blue: #007AFF;
            --btn-light-blue: #E8F2FF;
            --accent-orange: #FFF5E9;
            --text-main: #1C1C1E;
            --text-secondary: #8E8E93;
            --apple-red: #FF3B30;
            --apple-green: #34C759;
        }

        body {
            font-family: -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            border-radius: 32px;
            padding: 28px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.04);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .header h1 { font-size: 24px; font-weight: 700; margin: 0; letter-spacing: -0.5px; }

        .input-section { margin-bottom: 20px; }
        .label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            display: block;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            background: var(--input-bg);
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            color: var(--text-main);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .plan-box {
            background: var(--accent-orange);
            padding: 20px;
            border-radius: 22px;
            border: 1px solid #FFE0C2;
            margin-bottom: 25px;
        }
        .plan-box input, .plan-box select { background: #FFFFFF; }
        .plan-box .label { color: #A27E5A; font-weight: 600; }

        .btn-calc {
            background: var(--btn-light-blue);
            color: var(--primary-blue);
            width: 100%;
            border: none;
            border-radius: 16px;
            padding: 18px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .btn-calc:active { opacity: 0.7; transform: scale(0.98); }

        .footer-link {
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .res-card {
            background: #F9F9FB;
            border-radius: 22px;
            padding: 20px;
            margin-top: 15px;
            border: 0.5px solid #EEE;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .res-header { display: flex; justify-content: space-between; align-items: center; }
        .step-tag { background: var(--primary-blue); color: white; padding: 3px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; }
        .rise-tag { color: var(--apple-red); font-weight: 700; font-size: 14px; }
        
        .res-body { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border-bottom: 1px dashed #DDD; padding-bottom: 12px; }
        .val-group .v-label { font-size: 11px; color: var(--text-secondary); display: block; margin-bottom: 2px; }
        .val-group .v-main { font-size: 17px; font-weight: 700; }
        
        .res-footer { font-size: 12px; color: var(--text-secondary); display: flex; flex-direction: column; gap: 6px; }
        .loss-text { color: var(--apple-green); font-weight: 600; font-size: 13px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>基金加仓计划</h1>
        <div class="theme-icon">🌗</div>
    </div>

    <!-- 1. 原持仓成本 -->
    <div class="input-section">
        <span class="label">1. 原持仓成本价格 (基准点)</span>
        <input type="number" id="baseCost" value="1.2000" step="0.0001">
    </div>

    <!-- 2 & 3 持有总额与当前净值 -->
    <div class="grid-2 input-section">
        <div>
            <span class="label">2. 当前持有总额 (元)</span>
            <input type="number" id="baseAmount" value="10000">
        </div>
        <div>
            <span class="label">3. 现在的价格</span>
            <input type="number" id="basePrice" value="1.1500" step="0.0001">
        </div>
    </div>

    <!-- 计划加仓策略 -->
    <div class="plan-box">
        <div class="grid-2">
            <div>
                <span class="label">4. 计划加仓金额</span>
                <input type="number" id="firstAdd" value="2000">
            </div>
            <div>
                <span class="label">5. 每跌多少加仓 %</span>
                <input type="number" id="dropPercent" value="5">
            </div>
        </div>
        <div style="margin-top: 15px;">
            <span class="label">加仓金额递增模式</span>
            <select id="investMode">
                <option value="1.0">固定金额 (1.0x)</option>
                <option value="1.5">稳健增量 (1.5x)</option>
                <option value="2.0">进取倍投 (2.0x)</option>
            </select>
        </div>
    </div>

    <button class="btn-calc" onclick="runPlan()">开始加仓计划模拟</button>
    <div class="footer-link" onclick="location.reload()">🗑️ 清空历史数据</div>
    <div id="resultsArea" style="margin-top:20px"></div>
</div>

<script>
    function runPlan() {
        const baseCost = parseFloat(document.getElementById('baseCost').value);
        const baseAmount = parseFloat(document.getElementById('baseAmount').value);
        const basePrice = parseFloat(document.getElementById('basePrice').value);
        const ratio = parseFloat(document.getElementById('investMode').value);
        const firstAdd = parseFloat(document.getElementById('firstAdd').value);
        const dropPercent = parseFloat(document.getElementById('dropPercent').value) / 100;

        if(!baseCost || !baseAmount || !basePrice || !firstAdd) {
            alert("请完整填写数据");
            return;
        }

        let totalAmount = baseAmount;
        let totalShares = baseAmount / baseCost;
        let nextAddMoney = firstAdd;

        const resultsArea = document.getElementById('resultsArea');
        resultsArea.innerHTML = `<span class="label">📉 按照成本价阶梯下跌模拟：</span>`;

        // 核心逻辑：以 baseCost 为基准，每跌 dropPercent 触发一次
        for (let i = 1; i <= 6; i++) {
            // 触发价 = 成本价 * (1 - 跌幅% * 阶数)
            let nextPrice = baseCost * (1 - (dropPercent * i));
            
            // 如果触发价高于当前价格，说明该阶梯已经“错过”或者已经在亏损区间，模拟仍会显示其影响
            if (i > 1) nextAddMoney *= ratio;

            totalShares += (nextAddMoney / nextPrice);
            totalAmount += nextAddMoney;
            
            let newCost = totalAmount / totalShares;
            let currentMarketValue = totalShares * nextPrice;
            let currentTotalLoss = currentMarketValue - totalAmount; 
            let needRise = ((newCost - nextPrice) / nextPrice * 100).toFixed(1);

            resultsArea.innerHTML += `
                <div class="res-card">
                    <div class="res-header">
                        <span class="step-tag">成本价跌 ${(dropPercent*i*100).toFixed(0)}%</span>
                        <span class="rise-tag">需涨 ${needRise}% 回本</span>
                    </div>
                    <div class="res-body">
                        <div class="val-group">
                            <span class="v-label">计划买入价</span>
                            <span class="v-main">${nextPrice.toFixed(4)}</span>
                        </div>
                        <div class="val-group" style="text-align:right">
                            <span class="v-label">加仓后新均价</span>
                            <span class="v-main" style="color:var(--primary-blue)">${newCost.toFixed(4)}</span>
                        </div>
                    </div>
                    <div class="res-footer">
                        <span>本笔投入: <b>¥${Math.round(nextAddMoney).toLocaleString()}</b> &nbsp;|&nbsp; 累计总额: <b>¥${Math.round(totalAmount).toLocaleString()}</b></span>
                        <span class="loss-text">该位预估浮亏: -¥${Math.abs(Math.round(currentTotalLoss)).toLocaleString()}</span>
                    </div>
                </div>
            `;
        }
        resultsArea.scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
